volumes:
  data:
  tool_cache:
  dind-storage:
  mcp_cache:
  ollama:

  neo4j-data:
  neo4j-logs:

services:
  graph:
    image: neo4j:2026.09.0-community
    environment:
      NEO4J_AUTH: none
      NEO4J_server_memory_heap_initial__size: ${NEO4J_HEAP_SIZE:-1g}
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP_SIZE:-1g}
      NEO4J_server_memory_pagecache_size: ${NEO4J_PAGECACHE_SIZE:-256m}
      NEO4J_dbms_memory_transaction_total_max: ${NEO4J_TRANSACTION_MEMORY_LIMIT:-}
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    healthcheck:
      test: ["CMD", "cypher-shell", "-a", "bolt://localhost:7687", "RETURN 1"]
      interval: 30s
      retries: 3
      start_period: 30s
      timeout: 10s

  db:
    image: qdrant/qdrant:latest
    volumes:
      - data:/qdrant/storage
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:6333/readyz" ]
      interval: 30s
      retries: 3
      start_period: 10s
      timeout: 5s

  ollama:
    image: ollama/ollama
    volumes:
      - "ollama:/root/.ollama"

  ollama_pull:
    image: ollama/ollama
    environment:
      OLLAMA_HOST: "${OLLAMA_HOST:-ollama:11434}"
    depends_on:
      - ollama
    entrypoint: [ "sh", "-c", "sleep 3 && ollama pull llama3.2:3b" ]

  dind:
    image: docker:dind
    privileged: true
    environment:
      - DOCKER_TLS_CERTDIR=
    volumes:
      - dind-storage:/var/lib/docker

  mcp:
    image: ghcr.io/double16/shyhurricane:main
    depends_on:
      - dind
      - db
      - graph
      - ollama
      - ollama_pull
    environment:
      DOCKER_HOST: "tcp://dind:2375"
      QDRANT: "db:6333"
      NEO4J: "bolt://graph:7687"
      GRAPH_LIBRARY_ANALYSIS: "${GRAPH_LIBRARY_ANALYSIS:-summary}"
      TOOL_CACHE: "/tool_cache"
      MCP_SESSION_VOLUME: "mcp_session"
      LOG_FILE: "${LOG_FILE:-}"
      ENABLE_HEAP_PROFILING: "${ENABLE_HEAP_PROFILING:-false}"
      INDEXING_WAIT_TIMEOUT_SECONDS: "${INDEXING_WAIT_TIMEOUT_SECONDS:-60}"
      DISK_MIN_FREE_PERCENT: "${DISK_MIN_FREE_PERCENT:-3}"
      DISK_MIN_FREE_BYTES: "${DISK_MIN_FREE_BYTES:-2147483648}"
      DISK_RESUME_MARGIN_PERCENT: "${DISK_RESUME_MARGIN_PERCENT:-1}"
      DISK_RESUME_MARGIN_BYTES: "${DISK_RESUME_MARGIN_BYTES:-536870912}"
      TOOL_RESULT_TTL_SECONDS: "${TOOL_RESULT_TTL_SECONDS:-86400}"
      MCP_TRANSPORT: "${MCP_TRANSPORT:-streamable-http}"
      DISABLE_ELICITATION: "${DISABLE_ELICITATION:-True}"
      OLLAMA_MODEL: "${OLLAMA_MODEL}"
      OLLAMA_HOST: "${OLLAMA_HOST:-ollama:11434}"
      GEMINI_API_KEY: "${GEMINI_API_KEY}"
      GEMINI_MODEL: "${GEMINI_MODEL}"
      OPENAI_MODEL: "${OPENAI_MODEL}"
      OPENAI_API_KEY: "${OPENAI_API_KEY}"
      LITELLM_MODEL: "${LITELLM_MODEL}"
      LITELLM_API_BASE: "${LITELLM_API_BASE}"
      LITELLM_API_KEY: "${LITELLM_API_KEY}"
      BEDROCK_MODEL: "${BEDROCK_MODEL}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY}"
      PYTORCH_ENABLE_MPS_FALLBACK: "1"
      ANONYMIZED_TELEMETRY: "False"
      HAYSTACK_TELEMETRY_ENABLED: "False"
      HAYSTACK_TELEMETRY_DISABLED: "1"
      TRANSFORMERS_NO_ADVISORY_WARNINGS: "1"
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
      # OMP_NUM_THREADS may need to be reduced, but choosing based on cores seems fine
      #OMP_NUM_THREADS: "6"
      # MKL_NUM_THREADS > 1 will cause the embedder to lock
      MKL_NUM_THREADS: "1"
    shm_size: "2g"
    ports:
      - "8000:8000"
      - "8010:8010"
    volumes:
      - "data:/data"
      - "tool_cache:/tool_cache"
      - "mcp_cache:/home/runner/.cache"
